name: epoch

# Hourly settlement. Vercel Hobby cron only runs once a day, so this calls the job every hour.
# Set two repository secrets first: SITE_URL (https://app.your-domain) and CRON_SECRET (the same
# value as the site's CRON_SECRET env var). Without them the run is skipped, not failed.

on:
  schedule:
    - cron: "5 * * * *" # minute 5 of every hour, after the epoch has closed
  workflow_dispatch:

concurrency:
  group: epoch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Settle finished epochs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 90 -X POST "${SITE_URL%/}/api/epoch/run" -H "authorization: Bearer $CRON_SECRET"
